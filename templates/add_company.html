<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Company - Campus Career Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="page-header">
        <h1>🏢 Add Company</h1>
        <p>Placement Officer / Admin Panel</p>
    </div>


    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}


    <!-- Add Company Form -->
    <form method="POST"
          action="{{ url_for('add_company') }}">

        <div class="form-group">
            <label for="company_name">
                Company Name
            </label>

            <input type="text"
                   id="company_name"
                   name="company_name"
                   placeholder="Enter company name"
                   required>
        </div>


        <div class="form-group">
            <label for="job_role">
                Job Role
            </label>

            <input type="text"
                   id="job_role"
                   name="job_role"
                   placeholder="Example: Software Developer"
                   required>
        </div>


        <div class="form-group">
            <label for="min_cgpa">
                Minimum CGPA
            </label>

            <input type="number"
                   id="min_cgpa"
                   name="min_cgpa"
                   placeholder="Example: 7.0"
                   min="0"
                   max="10"
                   step="0.01"
                   required>
        </div>


        <div class="form-group">
            <label for="department">
                Eligible Department
            </label>

            <select id="department"
                    name="department"
                    required>

                <option value="">
                    -- Select Department --
                </option>

                <option value="ALL">
                    All Departments
                </option>

                <option value="IT">
                    Information Technology
                </option>

                <option value="CSE">
                    Computer Science Engineering
                </option>

                <option value="ECE">
                    Electronics and Communication Engineering
                </option>

                <option value="EEE">
                    Electrical and Electronics Engineering
                </option>

                <option value="MECH">
                    Mechanical Engineering
                </option>

                <option value="CIVIL">
                    Civil Engineering
                </option>

                <option value="AIDS">
                    Artificial Intelligence and Data Science
                </option>

                <option value="AIML">
                    Artificial Intelligence and Machine Learning
                </option>

            </select>
        </div>


        <div class="form-group">
            <label for="package">
                Package
            </label>

            <input type="text"
                   id="package"
                   name="package"
                   placeholder="Example: 5 LPA"
                   required>
        </div>


        <div class="form-group">
            <label for="required_skills">
                Required Skills
            </label>

            <textarea id="required_skills"
                      name="required_skills"
                      rows="4"
                      placeholder="Example: Python, SQL, Flask, HTML, CSS"></textarea>

            <small>
                Enter skills separated by commas.
            </small>
        </div>


        <button type="submit" class="btn">
            ➕ Add Company
        </button>

    </form>


    <!-- Navigation -->
    <div class="button-group">

        <a href="{{ url_for('admin') }}" class="btn">
            ← Admin Dashboard
        </a>

        <a href="{{ url_for('admin_logout') }}"
           class="btn logout-btn">
            Logout
        </a>

    </div>

</div>

</body>
</html>
